name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The accessibility pass needs a Linux browser host. Keep it on the
    # approved Ultra fleet, which already carries the pinned toolchain.
    runs-on: [self-hosted, linux, x64, universe, gcp, universe-gcp-medium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@fd406c34c10a8275c370e22531e1c3d4aa32a901
      - name: Install pnpm
        run: npm install -g pnpm@10.34.5
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace tests (manifest validator, sync registry)
        run: pnpm test
      - name: Typecheck the workspace
        run: pnpm typecheck
      - name: Build the portal (validates every internal link and anchor)
        run: pnpm --filter @universe/docs-portal build
      - name: Search index exists
        run: test -f apps/portal/dist/pagefind/pagefind.js
      - name: Sitemap exists
        run: test -f apps/portal/dist/sitemap-index.xml
      - name: Install a browser for the accessibility audit
        # The approved Ultra image already carries Chromium's Linux libraries.
        # Invoke the workspace-pinned Playwright package and download only the
        # browser, so CI never asks for passwordless sudo or pulls an unpinned
        # package through npx.
        run: pnpm --filter @universe/docs-quality exec playwright install chromium
      - name: Accessibility and sideways scroll, every page, both themes
        run: node packages/docs-quality/bin/check-accessibility.mjs --dist apps/portal/dist
