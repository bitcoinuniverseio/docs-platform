name: Dev deploy
on:
  push:
    branches: [develop]
    paths:
      - "apps/portal/**"
      - "packages/design-system/**"
      - "packages/ecosystem-registry/**"
      - "packages/content-schema/**"
      - "packages/docs-quality/**"
      - "sources.lock.json"
      - "tooling/sync/**"
      - "tooling/deploy/**"
      - "sources/generated/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".node-version"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/dev-deploy.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-prepare.yml"
      - ".github/workflows/deploy-publish.yml"
      - ".github/workflows/deploy-recovery.yml"
      - "!packages/**/README.md"
      - "!tooling/**/README.md"
      - "!apps/portal/README.md"
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Optional successful accepted run ID to redeploy identical bytes
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: dev-deploy-docs
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/develop' && github.run_attempt == 1 && inputs.artifact_run == ''
    uses: ./.github/workflows/deploy-prepare.yml
    with:
      target: dev
  redeploy-target:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && github.run_attempt == 1 && inputs.artifact_run != ''
    runs-on: [self-hosted, runners-4]
    outputs:
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_TARGET: dev
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          ROLLBACK_SHA: ${{ github.sha }}
        run: node tooling/deploy/resolve.mjs redeploy
  publish:
    needs: [prepare, redeploy-target]
    if: always() && !cancelled() && ((needs.prepare.result == 'success' && needs.prepare.outputs.ship == 'true') || needs.redeploy-target.result == 'success')
    uses: ./.github/workflows/deploy-publish.yml
    with:
      target: dev
      sha: ${{ github.sha }}
      run_id: ${{ needs.redeploy-target.outputs.run_id || github.run_id }}
      artifact_id: ${{ needs.redeploy-target.outputs.artifact_id || needs.prepare.outputs.artifact_id }}
    secrets: inherit
