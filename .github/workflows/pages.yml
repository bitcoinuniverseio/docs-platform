name: pages

# Publishes the portal to GitHub Pages from develop, served at
# docs.bitcoinuniverse.io via the CNAME file in apps/portal/public.
#
# The build uses the production site URL and no base path, because the portal is
# served from the root of its own domain. Content markdown links are absolute
# site paths, which only resolve correctly at a domain root.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: runs-on=${{ github.run_id }}-pages/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - name: Install pnpm
        run: npm install -g pnpm@10.34.5
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace tests
        run: pnpm test
      - name: Build the portal
        run: pnpm --filter @universe/docs-portal build
      - name: Search index exists
        run: test -f apps/portal/dist/pagefind/pagefind.js
      - name: Machine-readable routes exist and are non-empty
        run: |
          test -s apps/portal/dist/ecosystem.json
          test -s apps/portal/dist/llms.txt
          test -f apps/portal/dist/sitemap-index.xml
      - name: Custom domain is carried into the artifact
        run: grep -qx 'docs.bitcoinuniverse.io' apps/portal/dist/CNAME
      - name: Catalog pages were generated, not empty
        run: |
          test -f apps/portal/dist/protocols/index.html
          test -f apps/portal/dist/protocols/runes/index.html
          test -f apps/portal/dist/products/core/index.html
          test -f apps/portal/dist/chains/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: runs-on=${{ github.run_id }}-deploy/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
