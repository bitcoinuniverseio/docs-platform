name: deploy

# Production deploys only from main, and only the exact commit that passed.
# Nothing is ever published from a working tree.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Commit to roll back to. Leave empty to deploy this ref."
        required: false
        type: string

permissions:
  contents: read

# Never let two deploys race for the same symlink.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, universe, gcp, universe-gcp-medium]
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@fd406c34c10a8275c370e22531e1c3d4aa32a901

      - name: Install pnpm
        run: npm install -g pnpm@10.34.5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned sources still validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm sync:verify

      - name: Build the portal
        run: pnpm --filter @universe/docs-portal build

      - name: Install a browser for the accessibility audit
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate
        run: node packages/docs-quality/bin/check-accessibility.mjs --dist apps/portal/dist

      - name: Prepare SSH authentication
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          DOCS_DEPLOY_PASSWORD: ${{ secrets.DOCS_DEPLOY_PASSWORD }}
        run: |
          auth_dir="${RUNNER_TEMP}/docs-auth"
          if [ -n "$DOCS_DEPLOY_KEY" ]; then
            install -m 700 -d "$auth_dir"
            printf '%s\n' "$DOCS_DEPLOY_KEY" > "$auth_dir/key"
            chmod 600 "$auth_dir/key"
          elif [ -n "$DOCS_DEPLOY_PASSWORD" ]; then
            install -m 700 -d "$auth_dir"
            printf '%s\n' '#!/usr/bin/env sh' 'printf "%s\\n" "$DOCS_PASSWORD"' > "$auth_dir/askpass"
            chmod 700 "$auth_dir/askpass"
          else
            echo "DOCS_DEPLOY_KEY or DOCS_DEPLOY_PASSWORD is required" >&2
            exit 2
          fi

      - name: Deploy
        if: ${{ inputs.rollback_to == '' }}
        env:
          DOCS_HOST: ${{ secrets.DOCS_HOST }}
          DOCS_SSH_KEY: ${{ runner.temp }}/docs-auth/key
          DOCS_PASSWORD: ${{ secrets.DOCS_DEPLOY_PASSWORD }}
          SSH_ASKPASS: ${{ runner.temp }}/docs-auth/askpass
        run: bash tooling/deploy/deploy.sh apps/portal/dist "${{ github.sha }}"

      - name: Roll back
        if: ${{ inputs.rollback_to != '' }}
        env:
          DOCS_HOST: ${{ secrets.DOCS_HOST }}
          DOCS_SSH_KEY: ${{ runner.temp }}/docs-auth/key
          DOCS_PASSWORD: ${{ secrets.DOCS_DEPLOY_PASSWORD }}
          SSH_ASKPASS: ${{ runner.temp }}/docs-auth/askpass
        run: bash tooling/deploy/rollback.sh "${{ inputs.rollback_to }}"

      - name: Remove deployment authentication helpers
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/docs-auth/key" "${RUNNER_TEMP}/docs-auth/askpass"
          rmdir "${RUNNER_TEMP}/docs-auth" 2>/dev/null || true

      - name: Report what is live
        run: |
          live=$(curl -sf https://docs.bitcoinuniverse.io/RELEASE)
          echo "live release: $live"
          echo "### Documentation portal" >> "$GITHUB_STEP_SUMMARY"
          echo "Live release: \`$live\`" >> "$GITHUB_STEP_SUMMARY"
