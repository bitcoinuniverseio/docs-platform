name: deploy
# No main push can publish. Exact order, branch and protected environment required.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: DEPLOY-PRODUCTION (or ROLLBACK-PRODUCTION for rollback)
        required: true
        type: string
      rollback_to:
        description: Full target SHA of a previously accepted successful production run
        required: false
        type: string
      artifact_run:
        description: Original successful run ID, required for rollback
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-PRODUCTION' && inputs.rollback_to == '' && inputs.artifact_run == '' && github.run_attempt == 1
    uses: ./.github/workflows/deploy-prepare.yml
    with:
      target: production
  rollback-target:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && ((inputs.confirm == 'ROLLBACK-PRODUCTION' && inputs.rollback_to != '') || (inputs.confirm == 'DEPLOY-PRODUCTION' && inputs.rollback_to == '' && inputs.artifact_run != ''))
    runs-on: [self-hosted, runners-4]
    outputs:
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          ROLLBACK_SHA: ${{ inputs.rollback_to || github.sha }}
        run: node tooling/deploy/resolve.mjs rollback
  publish:
    needs: [prepare, rollback-target]
    if: always() && !cancelled() && inputs.rollback_to == '' && ((needs.prepare.result == 'success' && needs.prepare.outputs.ship == 'true') || needs.rollback-target.result == 'success')
    uses: ./.github/workflows/deploy-publish.yml
    with:
      target: production
      sha: ${{ github.sha }}
      run_id: ${{ needs.rollback-target.outputs.run_id || github.run_id }}
      artifact_id: ${{ needs.rollback-target.outputs.artifact_id || needs.prepare.outputs.artifact_id }}
    secrets: inherit
  rollback:
    needs: rollback-target
    if: inputs.rollback_to != '' && inputs.confirm == 'ROLLBACK-PRODUCTION'
    uses: ./.github/workflows/deploy-publish.yml
    with:
      target: production
      sha: ${{ needs.rollback-target.outputs.sha }}
      run_id: ${{ needs.rollback-target.outputs.run_id }}
      artifact_id: ${{ needs.rollback-target.outputs.artifact_id }}
      rollback: true
    secrets: inherit
